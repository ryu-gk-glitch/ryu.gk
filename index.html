<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GKアナライザー</title>
<meta name="theme-color" content="#0f5eb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GK分析">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef2f4;--card:#fff;--tx:#10202b;--mu:#62727e;--ln:#d3dce2;--ac:#0b5d7a;--sv:#14915a;--gl:#d8432f;--ot:#7b8791;--cw:#e6f0f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151b;--card:#16222b;--tx:#e6eef2;--mu:#8da0ac;--ln:#294454;--ac:#4cc0e6;--sv:#35c47a;--gl:#f0705c;--ot:#8da0ac;--cw:#1b2c37}}
:root[data-theme="dark"]{--bg:#0d151b;--card:#16222b;--tx:#e6eef2;--mu:#8da0ac;--ln:#294454;--ac:#4cc0e6;--sv:#35c47a;--gl:#f0705c;--ot:#8da0ac;--cw:#1b2c37}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;max-width:520px;margin:0 auto;padding:10px 12px 40px}
h1{font-size:17px;margin:4px 0 8px}h2{font-size:14px;margin:16px 0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,input{font:inherit;color:inherit}
.chip{flex:1;min-width:0;padding:9px 4px;border:1.5px solid var(--ln);background:var(--card);border-radius:8px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.tabs{display:flex;border-bottom:2px solid var(--ln);margin-bottom:10px}
.tabs .chip{border:0;border-radius:0;background:none;font-weight:700;color:var(--mu)}
.tabs .chip.on{background:none;color:var(--ac);box-shadow:inset 0 -3px 0 var(--ac)}
.card{background:var(--card);border-radius:10px;padding:8px}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:3px solid var(--tx);border-radius:4px;padding:4px;background:var(--cw)}
.goal button,.goal div{min-height:54px;border:0;border-radius:4px;background:var(--card);font-size:12px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.goal button.on{background:var(--ac);color:#fff;font-weight:700}
.res button{flex:1;padding:16px 4px;border:0;border-radius:10px;color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.sv{background:var(--sv)}.gl{background:var(--gl)}.ot{background:var(--ot)}
input{width:100%;padding:9px;border:1.5px solid var(--ln);border-radius:8px;background:var(--card)}
.mu{color:var(--mu);font-size:13px}
.big{display:flex;gap:8px}.big div{flex:1;background:var(--card);border-radius:10px;padding:8px;text-align:center}
.big b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--ln)}
.wrap{overflow-x:auto}
.zg{display:grid;grid-template-columns:repeat(30,1fr);grid-template-areas:"LW LW LW LW LW LW PL PL PL PL PL PL PC PC PC PC PC PC PR PR PR PR PR PR RW RW RW RW RW RW" "LI LI LI LI LI LI LI LI LI LI CI CI CI CI CI CI CI CI CI CI RI RI RI RI RI RI RI RI RI RI" "LB LB LB LB LB LB LB LB LB LB CB CB CB CB CB CB CB CB CB CB RB RB RB RB RB RB RB RB RB RB";column-gap:0;row-gap:5px;background:var(--cw);padding:5px;border-radius:8px}.zg.f{grid-template-columns:repeat(3,1fr);grid-template-areas:"FL FC FR"}.zg.s{grid-template-columns:repeat(2,1fr);grid-template-areas:"P7 EM"}.zg button,.zg div{margin:0 2.5px;min-height:58px;border:0;border-radius:6px;background:var(--card);color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}.zg button.on{background:var(--ac);color:#fff;font-weight:700}.lt{--bg:#eef2f4;--card:#fff;--tx:#10202b;--mu:#62727e;--ln:#d3dce2;--ac:#0b5d7a;--sv:#14915a;--gl:#d8432f;--ot:#7b8791;--cw:#e6f0f2}#printroot{display:none;color:var(--tx);background:var(--bg)}.ph{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.pn{font-size:18px;font-weight:800;margin:4px 0}
@media print{@page{size:A4;margin:10mm}body>*:not(#printroot){display:none!important}#printroot{display:block!important}html,body{background:#fff!important;padding:0!important;margin:0!important;max-width:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{break-after:page;page-break-after:always;background:var(--bg);padding:6px}.pg:last-child{break-after:auto;page-break-after:auto}.pg [style*="sticky"]{position:static!important}.card,.zg,.goal,tr,.bn,svg{break-inside:avoid}}
.mt{margin-top:8px}.bn{display:grid;grid-template-columns:44px 1fr 88px;align-items:center;gap:6px;margin:3px 0;font-size:12px}.bb{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--cw)}.bb i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-style:normal;font-weight:700}.bh{font-weight:700;font-size:12px;margin:8px 0 2px}.lg{display:flex;gap:12px;font-size:11px;margin-bottom:4px}.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}.row.wr{display:grid;grid-template-columns:repeat(3,1fr)}.wr .chip{flex:none;min-width:0;height:44px;padding:0 2px;white-space:nowrap}.reg{width:100%;margin-top:12px;padding:16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:800;font-size:17px;cursor:pointer}.res.has button:not(.sel){opacity:.4}.res button.sel{outline:3px solid var(--tx);outline-offset:2px}.rl{display:flex;justify-content:space-between;gap:8px;width:100%;margin-top:4px;padding:9px;border:0;border-radius:6px;background:var(--card);font-size:13px;text-align:left;cursor:pointer}.rl.ed{outline:2px solid var(--ac)}.cur{font-weight:700;margin:2px 0 8px}.link{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;padding:8px 0}
</style></head><body>
<h1>🤾 GKアナライザー</h1>
<div class="tabs"><button class="chip" id="t0">🏠 ホーム</button><button class="chip" id="t1">入力</button><button class="chip" id="t2">分析</button></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),KEY='gk_data_v1',MK='gk_matches_v1',GL='gk_list_v1';
const TY={p:'7m',f:'速攻',e:'エンプティ'},CL=['左上','中上','右上','左中','中央','右中','左下','中下','右下'];
const ZN={LW:'左W',PL:'PV左',PC:'PV中',PR:'PV右',RW:'右W',LB:'左ロング',CB:'中ロング',RB:'右ロング',LI:'左カットイン',CI:'中カットイン',RI:'右カットイン',FL:'速攻左',FC:'速攻中',FR:'速攻右',P7:'7m',EM:'エンプティ'}
const PL={'1':'前','2':'後','e':'延'};
const COL={s:'var(--sv)',g:'var(--gl)',o:'var(--ot)'};
const ZM=['LW','PL','PC','PR','RW','LI','CI','RI','LB','CB','RB'],ZF=['FL','FC','FR'],SM={u:'足上げ',a:'軸移動',l:'ランジ',d:'大の字',s:'スライディング',o:'その他'},ST={s:'スピン',l:'ループ',b:'ブラインド',k:'スカイ',r:'リバウンド',o:'その他'};;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=[],M=[],G=[],S={ty:'n',sh:'',z:null,c:null,sm:null,st:null,hd:null,r:null,eid:null,g:null,p:'1',x:1,h:1,tm:0},V='home',cur=null,F='all',FG='all',arm=false;
let imp=false,impMsg='',ED=null,SZ=null,TG=5,armM=null,selMode=false,selSet=new Set(),armS=false;const mx=()=>S.p=='e'?5:S.p=='t'?0:30;
try{D=JSON.parse(localStorage.getItem(KEY))||[];M=JSON.parse(localStorage.getItem(MK))||[];G=JSON.parse(localStorage.getItem(GL))||[];S.g=G[0]?G[0].id:null}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem(MK,JSON.stringify(M));localStorage.setItem(GL,JSON.stringify(G))}catch(e){}};
const rate=(a,b)=>a+b?Math.round(a/(a+b)*100):null;
const cnt=(d,r)=>d.filter(x=>x.r==r).length;
const TB=[];['1','2'].forEach(k=>[0,1,2].forEach(b=>TB.push([k+b,(k=='1'?'前半 ':'後半 ')+['0–9','10–19','20–30'][b]+'分'])));[[1,1],[1,2],[2,1],[2,2]].forEach(([x,h])=>TB.push(['e'+x+h,'第'+x+'延長 '+(h==1?'前半':'後半')]));TB.push(['e00','延長(区分なし)'],['t','7mTC']);
const tkey=r=>r.p=='e'?'e'+(r.x||0)+(r.h||0):r.p=='t'?'t':r.p?r.p+Math.min(Math.floor((r.tm||0)/10),2):'';
const plabel=r=>!r.p?'--':r.p=='t'?'7mTC':r.p=='e'?'第'+(r.x||'?')+'延'+(r.h?(r.h==1?'前':'後'):'')+' '+r.tm+'分':(r.p=='1'?'前':'後')+r.tm+'分';
const mname=()=>{const m=M.find(m=>m.id==cur);return m?m.name:'通算'};
function zg(fn){return`<div class="zg">${ZM.map(fn).join('')}</div><h2>速攻</h2><div class="zg f">${ZF.map(fn).join('')}</div><h2>特殊</h2><div class="zg s">${fn('P7')}${fn('EM')}</div>`}
function home(){
 const rows=M.slice().reverse().map(m=>{const d=D.filter(r=>r.m==m.id),R=rate(cnt(d,'s'),cnt(d,'g'));
  const head=`<b>${esc(m.name)}</b> <span class="mu">${m.date}</span><div class="mu">${d.length}本 / セーブ率 ${R==null?'–':R+'%'}</div>`;
  if(selMode)return`<label class="card mt row" style="flex-wrap:nowrap;cursor:pointer"><input type="checkbox" data-sel="${m.id}" ${selSet.has(m.id)?'checked':''} style="width:24px;height:24px;padding:0;flex:none"><div>${head}</div></label>`;
  return`<div class="card mt">${head}<div class="row mt"><button class="chip" data-go="in" data-id="${m.id}">入力する</button><button class="chip" data-go="st" data-id="${m.id}">分析を見る</button></div><div style="text-align:right"><button class="link" data-dm="${m.id}" style="${armM==m.id?'color:var(--gl)':''}">${armM==m.id?'本当に削除する(この試合の記録も消えます)':'この試合を削除'}</button></div></div>`}).join('');
 $('#app').innerHTML=`<div class="card"><b>新しい試合を始める</b><div class="row mt"><input id="nm" placeholder="相手チーム名(任意)" style="flex:1"><button class="chip" id="go" style="flex:none;padding:9px 16px;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700">開始</button></div></div>
<div class="card mt"><b>キーパー登録</b><div class="row mt">${G.map(k=>`<span class="chip" style="flex:none;padding:6px 10px">🧤 ${esc(k.name)}<button class="link" data-gd="${k.id}" style="padding:0 0 0 8px">×</button></span>`).join('')||'<span class="mu">まだ登録がありません</span>'}</div><div class="row mt"><input id="gn" placeholder="キーパー名" style="flex:1"><button class="chip" id="ga" style="flex:none;padding:9px 16px">追加</button></div></div>
 <button class="chip mt" id="all" style="width:100%">📊 通算分析(全${M.length}試合 / ${D.length}本)</button>
 <div class="row" style="justify-content:space-between"><h2 style="margin:16px 0 6px">試合一覧</h2>${M.length?`<button class="link" id="sel">${selMode?'選択をやめる':'選択して削除'}</button>`:''}</div>${rows||'<span class="mu">まだ試合がありません。上から開始してください。</span>'}
 ${selMode?`<div class="card mt" style="position:sticky;bottom:8px;box-shadow:0 2px 12px #0003"><div class="row"><button class="chip" id="sa">すべて選択</button><button class="chip" id="sd" style="flex:2;color:#fff;background:var(--gl);border-color:var(--gl);font-weight:700"></button></div></div>`:''}
 <div class="row mt" style="justify-content:space-between"><button class="link" id="cp">データをコピー(JSON)</button><button class="link" id="im">データを読み込む</button><button class="link" id="clr">${arm?'本当に全削除する':'全データ削除'}</button></div>
 ${imp?`<div class="card mt"><textarea id="it" rows="5" placeholder="コピーしたJSONをここに貼り付け" style="width:100%;border:1.5px solid var(--ln);border-radius:8px;padding:8px;background:var(--card);color:var(--tx);font:inherit"></textarea><button class="chip mt" id="ig" style="width:100%">読み込む(今あるデータに追加)</button></div>`:''}${impMsg?`<div class="mu mt">${impMsg}</div>`:''}`;
 $('#go').onclick=()=>{const m={id:Date.now(),name:$('#nm').value.trim()||'無題の試合',date:new Date().toLocaleDateString('ja-JP')};M.push(m);store();cur=m.id;S={...S,ty:'n',sh:'',z:null,c:null,sm:null,st:null,hd:null,r:null,eid:null,p:'1',tm:0};show('in')};

 $('#ga').onclick=()=>{const n=$('#gn').value.trim();if(!n)return;const k={id:Date.now(),name:n};G.push(k);if(S.g==null)S.g=k.id;store();home()};
 document.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{G=G.filter(k=>k.id!=+b.dataset.gd);if(S.g==+b.dataset.gd)S.g=G[0]?G[0].id:null;store();home()});
 const upd=()=>{const b=$('#sd');if(!b)return;const n=selSet.size;b.textContent=n?(armS?'本当に'+n+'件を削除する':'選択した'+n+'件を削除'):'試合を選んでください';b.style.opacity=n?1:.5};
 if(selMode){upd();
  document.querySelectorAll('[data-sel]').forEach(b=>b.onchange=()=>{const id=+b.dataset.sel;b.checked?selSet.add(id):selSet.delete(id);armS=false;upd()});
  $('#sa').onclick=()=>{selSet=selSet.size==M.length?new Set():new Set(M.map(m=>m.id));armS=false;home()};
  $('#sd').onclick=()=>{if(!selSet.size)return;if(!armS){armS=true;upd();return}M=M.filter(m=>!selSet.has(m.id));D=D.filter(r=>!selSet.has(r.m));if(selSet.has(cur))cur=null;selSet=new Set();selMode=false;armS=false;store();home()}}
 if($('#sel'))$('#sel').onclick=()=>{selMode=!selMode;selSet=new Set();armS=false;home()};
 document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{const id=+b.dataset.dm;if(armM==id){M=M.filter(m=>m.id!=id);D=D.filter(r=>r.m!=id);if(cur==id)cur=null;armM=null;store()}else armM=id;home()});
 $('#all').onclick=()=>{cur=null;show('st')};
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur=+b.dataset.id;show(b.dataset.go)});
 $('#cp').onclick=()=>{try{navigator.clipboard.writeText(JSON.stringify({matches:M,shots:D,keepers:G}));$('#cp').textContent='コピーしました'}catch(e){$('#cp').textContent='コピーできませんでした'}};
 $('#im').onclick=()=>{imp=!imp;impMsg='';home()};
 if(imp)$('#ig').onclick=()=>{try{const o=JSON.parse($('#it').value),am=(o.matches||[]).filter(m=>!M.some(x=>x.id==m.id)),as=(o.shots||[]).filter(s=>!D.some(x=>x.t==s.t)),ak=(o.keepers||[]).filter(k=>!G.some(x=>x.id==k.id));M.push(...am);D.push(...as);G.push(...ak);D.sort((a,b)=>a.t-b.t);if(S.g==null&&G[0])S.g=G[0].id;store();imp=false;impMsg='試合'+am.length+'件・記録'+as.length+'件・キーパー'+ak.length+'人を読み込みました';home()}catch(e){$('#ig').textContent='読み込めません。コピーしたJSONか確認してください'}};
 $('#clr').onclick=()=>{if(arm){D=[];M=[];cur=null;store();arm=false}else arm=true;home()}}
function input(){
 const d=D.filter(r=>r.m==cur),gn=id=>{const k=G.find(k=>k.id==id);return k?k.name:''};
 const lst=d.slice().reverse().slice(0,40).map(r=>`<button class="rl ${S.eid==r.t?'ed':''}" data-e="${r.t}" style="border-left:5px solid ${COL[r.r]}"><span>${plabel(r)} ${ZN[r.z]||''}${r.c!=null?' → '+CL[r.c]:''}</span><span>${r.r=='s'?'セーブ':r.r=='g'?'失点':'枠外'}${r.sh?' #'+esc(r.sh):''}${r.g!=null&&gn(r.g)?' 🧤'+esc(gn(r.g)):''}</span></button>`).join('');
 $('#app').innerHTML=`${chart(d)}<div class="cur mt">vs ${esc(mname())}</div>${G.length?`<div class="row">${G.map(k=>`<button class="chip ${S.g==k.id?'on':''}" data-g="${k.id}">🧤 ${esc(k.name)}</button>`).join('')}</div>`:'<div class="mu">ホームでキーパーを登録すると、キーパーごとに記録できます</div>'}
<h2>時間</h2><div class="row">${[['1','前半'],['2','後半'],['e','延長'],['t','7mTC']].map(([k,l])=>`<button class="chip ${S.p==k?'on':''}" data-p="${k}">${l}</button>`).join('')}</div>
 ${S.p=='e'?`<div class="row mt">${[[1,'第1延長'],[2,'第2延長']].map(([k,l])=>`<button class="chip ${S.x==k?'on':''}" data-x="${k}">${l}</button>`).join('')}${[[1,'前半'],[2,'後半']].map(([k,l])=>`<button class="chip ${S.h==k?'on':''}" data-h="${k}">${l}</button>`).join('')}</div>`:''}
 ${S.p=='t'?'<div class="mu mt">7mTCは時間の入力なしで記録します</div>':`<div class="row mt">${[-5,-1].map(n=>`<button class="chip" data-t="${n}">${n}</button>`).join('')}<b style="flex:1.4;text-align:center;font-size:22px">${S.tm}分</b>${[1,5].map(n=>`<button class="chip" data-t="${n}">+${n}</button>`).join('')}</div>`}
 <h2>① 相手の背番号(任意)</h2><input id="sh" inputmode="numeric" placeholder="例: 9" value="${esc(S.sh)}">
 <div class="row mt">${[['r','右利き'],['l','左利き']].map(([k,l])=>`<button class="chip ${S.hd==k?'on':''}" data-hd="${k}">${l}</button>`).join('')}</div>
 <h2>② シュート位置(上がゴール)</h2>${zg(k=>`<button style="grid-area:${k}" class="${S.z==k?'on':''}" data-z="${k}">${ZN[k]}</button>`)}
 <h2>③ ゴールのどこに?(GK視点)</h2><div class="goal">${CL.map((c,i)=>`<button class="${S.c===i?'on':''}" data-c="${i}">${c}</button>`).join('')}</div>
 <h2>シュートの種類</h2><div class="row wr">${Object.entries(ST).map(([k,l])=>`<button class="chip ${S.st==k?'on':''}" data-st="${k}" style="${l.length>5?'font-size:11px':''}">${l}</button>`).join('')}</div>
 <h2>セーブ方法(セーブしたとき)</h2><div class="row wr">${Object.entries(SM).map(([k,l])=>`<button class="chip ${S.sm==k?'on':''}" data-sm="${k}" style="${l.length>5?'font-size:11px':''}">${l}</button>`).join('')}</div>
 <h2>④ 結果</h2><div class="row res ${S.r?'has':''}">${[['s','セーブ','sv'],['g','失点','gl'],['o','枠外','ot']].map(([k,l,c])=>`<button class="${c} ${S.r==k?'sel':''}" data-r="${k}">${l}</button>`).join('')}</div>
 <button class="reg" id="reg">${S.eid?'更新する':'登録'}</button>${S.eid?`<div class="row mt"><button class="chip" id="cx">編集をやめる</button><button class="chip" id="del" style="color:var(--gl)">この記録を削除</button></div>`:''}
 <div class="row" style="justify-content:space-between"><span class="mu" id="msg">${d.length}本 / セーブ${cnt(d,'s')} 失点${cnt(d,'g')}</span><button class="link" id="undo">1件取り消し</button></div>
 <h2>入力した記録(タップで編集)</h2>${lst||'<span class="mu">まだ記録がありません</span>'}`;

 $('#sh').oninput=e=>S.sh=e.target.value.trim();
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.g=+b.dataset.g;input()});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.p=b.dataset.p;S.tm=Math.min(S.tm,mx());input()});
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.x=+b.dataset.x;input()});
 document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=+b.dataset.h;input()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tm=Math.max(0,Math.min(mx(),S.tm+ +b.dataset.t));input()});
 document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{S.ty=b.dataset.ty;input()});
